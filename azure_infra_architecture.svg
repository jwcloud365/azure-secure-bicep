
<svg width="850" height="690" viewBox="0 0 850 690" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- Top: Internet Users -->
  <rect x="340" y="20" width="170" height="38" fill="#fff" stroke="#fa0" stroke-width="3"/>
  <text x="425" y="45" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Internet Users</text>

  <!-- WAF / App Gateway -->
  <rect x="340" y="75" width="170" height="50" rx="12" fill="#fcdcdc" stroke="#f00" stroke-width="2"/>
  <text x="425" y="100" font-size="18" text-anchor="middle" font-weight="bold" fill="#333">WAF / Application</text>
  <text x="425" y="118" font-size="18" text-anchor="middle" font-weight="bold" fill="#333">Gateway</text>
  <text x="425" y="135" font-size="13" text-anchor="middle" fill="#333">WAF_v2 SKU</text>
  <!-- Orange Arrow (Internet to WAF) -->
  <line x1="425" y1="58" x2="425" y2="75" stroke="#fa0" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Frontend VNet Box -->
  <rect x="60" y="170" width="310" height="270" fill="#eaf3ff" stroke="#1e90ff" stroke-width="4" rx="18"/>
  <text x="215" y="195" font-size="17" text-anchor="middle" font-weight="bold" fill="#1e90ff">Frontend VNet</text>
  <text x="215" y="215" font-size="14" text-anchor="middle" fill="#333">(10.0.0.0/16)</text>

  <!-- Backend VNet Box -->
  <rect x="480" y="170" width="310" height="270" fill="#b9f6ca" stroke="#009a57" stroke-width="4" rx="18"/>
  <text x="635" y="195" font-size="17" text-anchor="middle" font-weight="bold" fill="#009a57">Backend VNet</text>
  <text x="635" y="215" font-size="14" text-anchor="middle" fill="#333">(10.1.0.0/16)</text>

  <!-- WAF Subnet (Frontend) -->
  <rect x="90" y="235" width="120" height="55" fill="#fff" stroke="#fa0" stroke-width="2"/>
  <text x="150" y="262" font-size="13" text-anchor="middle" font-weight="bold" fill="#1e90ff">WAF Subnet</text>
  <text x="150" y="279" font-size="12" text-anchor="middle" fill="#333">(10.0.0.0/24)</text>

  <!-- App Service Subnet (Frontend) -->
  <rect x="90" y="305" width="120" height="55" fill="#fff" stroke="#1e90ff" stroke-width="2"/>
  <text x="150" y="330" font-size="13" text-anchor="middle" font-weight="bold" fill="#1e90ff">App Service Subnet</text>
  <text x="150" y="346" font-size="12" text-anchor="middle" fill="#333">(10.0.1.0/24)</text>

  <!-- App Service (Frontend) -->
  <rect x="110" y="395" width="90" height="40" fill="#fff" stroke="#1e90ff" stroke-dasharray="4" stroke-width="2"/>
  <text x="155" y="420" font-size="13" text-anchor="middle" font-weight="bold" fill="#1e90ff">App Service</text>
  <text x="155" y="434" font-size="11" text-anchor="middle" fill="#333">HTTPS Only</text>

  <!-- WAF NSG (Frontend) -->
  <rect x="240" y="235" width="100" height="38" fill="#fff" stroke="#f00" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="290" y="260" font-size="12" text-anchor="middle" font-weight="bold" fill="#f00">WAF NSG</text>

  <!-- App Service NSG (Frontend) -->
  <rect x="240" y="305" width="100" height="38" fill="#fff" stroke="#f00" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="290" y="330" font-size="12" text-anchor="middle" font-weight="bold" fill="#f00">App Service NSG</text>

  <!-- Database Subnet (Backend) -->
  <rect x="510" y="235" width="120" height="55" fill="#fff" stroke="#009a57" stroke-width="2"/>
  <text x="570" y="262" font-size="13" text-anchor="middle" font-weight="bold" fill="#009a57">Database Subnet</text>
  <text x="570" y="279" font-size="12" text-anchor="middle" fill="#333">(10.1.0.0/24)</text>

  <!-- SQL Database (Backend) -->
  <rect x="510" y="305" width="120" height="55" fill="#fff" stroke="#009a57" stroke-width="2"/>
  <text x="570" y="330" font-size="13" text-anchor="middle" font-weight="bold" fill="#009a57">SQL Database</text>
  <text x="570" y="346" font-size="12" text-anchor="middle" fill="#333">No public access</text>

  <!-- Database NSG (Backend) -->
  <rect x="650" y="235" width="110" height="38" fill="#fff" stroke="#f00" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="705" y="260" font-size="12" text-anchor="middle" font-weight="bold" fill="#f00">Database NSG</text>

  <!-- Private Endpoint -->
  <rect x="510" y="380" width="120" height="38" fill="#fff" stroke="#009a57" stroke-width="2"/>
  <text x="570" y="405" font-size="12" text-anchor="middle" font-weight="bold" fill="#009a57">Private Endpoint</text>

  <!-- Diagnostic Settings (Backend) -->
  <rect x="650" y="305" width="110" height="38" fill="#d1b3ff" stroke="#800080" stroke-width="2"/>
  <text x="705" y="330" font-size="12" text-anchor="middle" font-weight="bold" fill="#800080">Diagnostic Settings</text>

  <!-- Log Analytics (Bottom Center) -->
  <rect x="360" y="470" width="140" height="38" fill="#d1b3ff" stroke="#800080" stroke-width="2"/>
  <text x="430" y="495" font-size="13" text-anchor="middle" font-weight="bold" fill="#800080">Log Analytics</text>

  <!-- App Insights (Bottom Left) -->
  <rect x="130" y="470" width="120" height="38" fill="#d1b3ff" stroke="#800080" stroke-width="2"/>
  <text x="190" y="495" font-size="13" text-anchor="middle" font-weight="bold" fill="#800080">App Insights</text>

  <!-- Arrows -->
  <!-- Orange: Internet to WAF -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#fa0" />
    </marker>
    <marker id="arrowblue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1e90ff" />
    </marker>
    <marker id="arrowpurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#800080" />
    </marker>
  </defs>
  <!-- WAF to WAF Subnet -->
  <line x1="425" y1="125" x2="215" y2="235" stroke="#fa0" stroke-width="5" marker-end="url(#arrow)"/>
  <!-- WAF Subnet to App Subnet -->
  <line x1="150" y1="290" x2="150" y2="305" stroke="#1e90ff" stroke-width="5" marker-end="url(#arrowblue)"/>
  <!-- App Subnet to App Service -->
  <line x1="150" y1="360" x2="155" y2="395" stroke="#1e90ff" stroke-width="5" marker-end="url(#arrowblue)"/>
  <!-- App Service to Private Endpoint -->
  <line x1="200" y1="415" x2="510" y2="399" stroke="#1e90ff" stroke-width="5" marker-end="url(#arrowblue)"/>
  <!-- Private Endpoint to SQL DB -->
  <line x1="570" y1="380" x2="570" y2="360" stroke="#1e90ff" stroke-width="5" marker-end="url(#arrowblue)"/>
  <!-- App Service to App Insights -->
  <line x1="155" y1="435" x2="190" y2="470" stroke="#800080" stroke-width="2" marker-end="url(#arrowpurple)"/>
  <!-- App Insights to Log Analytics -->
  <line x1="250" y1="490" x2="360" y2="489" stroke="#800080" stroke-width="2" marker-end="url(#arrowpurple)"/>
  <!-- Diagnostic to Log Analytics -->
  <line x1="760" y1="324" x2="500" y2="489" stroke="#800080" stroke-width="2" marker-end="url(#arrowpurple)"/>
  <!-- SQL DB to Diagnostic -->
  <line x1="630" y1="330" x2="650" y2="324" stroke="#800080" stroke-width="2" marker-end="url(#arrowpurple)"/>
  <!-- VNet Peering (double arrow) -->
  <line x1="370" y1="310" x2="480" y2="310" stroke="#1e90ff" stroke-width="3" marker-end="url(#arrowblue)" marker-start="url(#arrowblue)"/>

  <!-- Legends -->
  <rect x="690" y="610" width="140" height="70" fill="#fff" stroke="#aaa" stroke-width="1"/>
  <text x="760" y="630" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">Legenda</text>
  <rect x="700" y="640" width="15" height="15" fill="#eaf3ff" stroke="#1e90ff"/>
  <text x="720" y="653" font-size="12" fill="#1e90ff">Frontend VNet</text>
  <rect x="700" y="660" width="15" height="15" fill="#b9f6ca" stroke="#009a57"/>
  <text x="720" y="673" font-size="12" fill="#009a57">Backend VNet</text>
  <rect x="790" y="640" width="15" height="15" fill="#d1b3ff" stroke="#800080"/>
  <text x="810" y="653" font-size="12" fill="#800080">Monitoring</text>
  <line x1="790" y1="670" x2="805" y2="670" stroke="#fa0" stroke-width="5"/>
  <text x="810" y="673" font-size="12" fill="#fa0">Externe traffic</text>
  <line x1="790" y1="685" x2="805" y2="685" stroke="#1e90ff" stroke-width="5"/>
  <text x="810" y="688" font-size="12" fill="#1e90ff">Interne traffic</text>
</svg>
